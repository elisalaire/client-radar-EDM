<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --card: #0f0f12; --accent: #3b82f6; --border: rgba(255, 255, 255, 0.1); }
        body { background-color: var(--bg); color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: var(--card); border: 1px solid var(--border); }
        .tech-font { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-4xl mx-auto">
        <header class="mb-10">
            <h1 class="text-3xl font-extrabold text-white uppercase tracking-tighter">Feedback <span class="text-blue-500">Radar</span></h1>
            <p class="text-slate-500 text-sm mt-2 font-mono uppercase tracking-widest">Status: Monitoring Active</p>
        </header>

        <div id="action-list" class="space-y-4">
            </div>
    </div>

    <script>
        async function loadFeedbacks() {
            try {
                const response = await fetch('feedbacks.json');
                const data = await response.json();
                const container = document.getElementById('action-list');
                
                container.innerHTML = data.map(item => {
                    const colors = {
                        'todo': 'border-amber-500/30 text-amber-500 bg-amber-500/5',
                        'in-progress': 'border-blue-500/30 text-blue-500 bg-blue-500/5',
                        'done': 'border-emerald-500/30 text-emerald-500 bg-emerald-500/5'
                    }[item.status] || 'border-slate-500 text-slate-500';

                    return `
                        <div class="glass p-6 rounded-2xl">
                            <div class="flex gap-3 mb-3">
                                <span class="tech-font text-[10px] px-2 py-0.5 rounded border ${colors} uppercase">${item.status}</span>
                                <span class="text-slate-600 text-[10px] font-mono uppercase">${item.category}</span>
                            </div>
                            <p class="text-white font-medium text-lg">${item.comment}</p>
                            <p class="text-[10px] text-slate-600 tech-font mt-4 uppercase">${item.client} // ${item.date}</p>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error("Erreur:", e);
                document.getElementById('action-list').innerHTML = "<p class='text-red-500'>Erreur de chargement des données.</p>";
            }
        }
        loadFeedbacks();
    </script>
</body>
</html>
