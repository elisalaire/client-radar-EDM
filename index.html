<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Radar | Enseignes de Marcq</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style>
        :root { 
            --bg: #05070a; 
            --card: rgba(20, 27, 45, 0.7); 
            --accent: #e51b77; 
            --warning: #f59e0b; 
            --border: rgba(255, 255, 255, 0.1); 
        }
        body { 
            background-color: var(--bg); 
            background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, #05070a 100%);
            color: #e2e8f0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh;
        }
        .glass { 
            background: var(--card); 
            backdrop-filter: blur(12px);
            border: 1px solid var(--border); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .glass:hover { border-color: var(--accent); transform: translateY(-4px); }
        .tech-font { font-family: 'JetBrains Mono', monospace; }
        .text-fuchsia { color: var(--accent); }
    </style>
</head>
<body class="p-6 md:p-12 lg:p-20 text-white">

    <div class="max-w-4xl mx-auto">
        <header class="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-6">
            <div>
                <h1 class="text-5xl font-extrabold uppercase tracking-tighter italic">Feedback <span class="text-fuchsia">Radar</span></h1>
                <p class="text-slate-500 text-sm mt-3 font-mono uppercase tracking-[0.2em] flex items-center text-white/40">
                    Terminal v5.2 // Harmony Mode
                </p>
            </div>
            <div id="stats" class="flex flex-wrap gap-4 justify-end font-mono"></div>
        </header>

        <div id="action-list" class="space-y-6 pb-24 text-white"></div>
    </div>

    <button data-tally-open="2Eb629" class="fixed bottom-10 right-10 bg-fuchsia hover:scale-110 active:scale-95 text-white px-8 py-5 rounded-full font-black shadow-2xl transition-all z-50 uppercase text-xs tracking-widest">
        Nouveau retour
    </button>

    <script>
        function openTallyModal(actionId) {
            Tally.openPopup('2Eb629', { layout: 'modal', width: 500, hiddenFields: { action_id: actionId } });
        }

        async function loadFeedbacks() {
            try {
                const response = await fetch('feedbacks.json');
                let data = await response.json();
                
                const priorityOrder = { 'question': 1, 'blocked': 2, 'todo': 3, 'done': 4 };

                data.sort((a, b) => {
                    const diff = (priorityOrder[a.status] || 99) - (priorityOrder[b.status] || 99);
                    if (diff !== 0) return diff;
                    return b.id - a.id;
                });

                // COMPTEURS COMPLETS : Total, Question, Bloqué, À Faire, Terminé
                document.getElementById('stats').innerHTML = `
                    <div class="text-right border-l border-white/10 pl-4"><p class="text-[9px] text-slate-500 uppercase font-bold tracking-widest">Total</p><p class="text-xl font-black text-white">${data.length}</p></div>
                    <div class="text-right border-l border-white/10 pl-4"><p class="text-[9px] text-fuchsia uppercase font-bold tracking-widest">Infos</p><p class="text-xl font-black text-fuchsia">${data.filter(i=>i.status==='question').length}</p></div>
                    <div class="text-right border-l border-white/10 pl-4"><p class="text-[9px] text-orange-400 uppercase font-bold tracking-widest">Bloqués</p><p class="text-xl font-black text-orange-400">${data.filter(i=>i.status==='blocked').length}</p></div>
                    <div class="text-right border-l border-white/10 pl-4"><p class="text-[9px] text-white/60 uppercase font-bold tracking-widest">À Faire</p><p class="text-xl font-black text-white/60">${data.filter(i=>i.status==='todo').length}</p></div>
                    <div class="text-right border-l border-white/10 pl-4"><p class="text-[9px] text-emerald-500 uppercase font-bold tracking-widest">Fait</p><p class="text-xl font-black text-emerald-500">${data.filter(i=>i.status==='done').length}</p></div>
                `;

                const container = document.getElementById('action-list');
                container.innerHTML = data.map(item => {
                    const config = {
                        'todo': { label: 'À Faire', class: 'border-white/20 text-white/60 bg-white/5' },
                        'blocked': { label: 'Bloqué', class: 'border-orange-500/40 text-orange-400 bg-orange-500/10' },
                        'question': { label: 'Besoin d\'infos', class: 'border-fuchsia/40 text-fuchsia bg-fuchsia/10' },
                        'done': { label: 'Validé', class: 'border-emerald-500/30 text-emerald-500 bg-emerald-500/5' }
                    }[item.status];

                    return `
                        <div class="glass p-8 rounded-[2rem] ${item.status === 'done' ? 'opacity-30 grayscale' : ''}">
                            <div class="flex items-center gap-4 mb-6">
                                <span class="tech-font text-[10px] px-3 py-1 rounded border ${config.class} uppercase font-bold tracking-widest">${config.label}</span>
                                <span class="text-slate-600 text-[10px] font-mono uppercase tracking-[0.2em] text-white/20">// ${item.category}</span>
                                ${item.waiting_for && item.status !== 'done' ? `<span class="ml-auto tech-font text-[10px] px-3 py-1 rounded-full font-bold border ${item.waiting_for === 'Valérie' ? 'bg-pink-500/10 text-pink-400 border-pink-500/20' : 'bg-blue-500/10 text-blue-400 border-blue-500/20'}">Attente : ${item.waiting_for}</span>` : ''}
                            </div>
                            <p class="text-white font-semibold text-xl leading-relaxed mb-6">${item.comment}</p>
                            ${item.query ? `
                                <div class="mt-6 p-6 bg-white/5 border border-white/10 rounded-2xl flex flex-col md:flex-row md:items-center justify-between gap-6">
                                    <div class="text-slate-300 text-sm font-medium italic">"${item.query}"</div>
                                    <button onclick="openTallyModal('#${item.id}')" class="shrink-0 px-5 py-2.5 border rounded-xl text-[10px] uppercase font-black tracking-widest transition-all ${item.photo_needed ? 'text-orange-400 border-orange-400/40 hover:bg-orange-400/10' : 'text-fuchsia border-fuchsia/40 hover:bg-fuchsia/10'}">
                                        ${item.photo_needed ? 'Envoyer photo' : 'Répondre'}
                                    </button>
                                </div>` : ''}
                            <div class="flex justify-between items-center mt-8 pt-6 border-t border-white/5 uppercase font-mono text-[10px] text-slate-600 tracking-widest">
                                <p>${item.client} <span class="ml-3 text-white/10 font-black">#${item.id}</span></p>
                                <p>${item.date}</p>
                            </div>
                        </div>`;
                }).join('');
            } catch (e) { console.error(e); }
        }
        loadFeedbacks();
    </script>
</body>
</html>
