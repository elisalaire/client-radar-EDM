<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Radar | Enseignes de Marcq</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style>
        :root { 
            --bg: #05070a; 
            --card: rgba(20, 27, 45, 0.7); 
            --accent: #e51b77; /* Le Rose Fuchsia de Marcq */
            --border: rgba(255, 255, 255, 0.1); 
        }
        body { 
            background-color: var(--bg); 
            background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, #05070a 100%);
            color: #e2e8f0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            letter-spacing: -0.01em; 
        }
        .glass { 
            background: var(--card); 
            backdrop-filter: blur(12px);
            border: 1px solid var(--border); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .glass:hover { 
            border-color: var(--accent); 
            transform: translateY(-4px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(229, 27, 119, 0.1);
        }
        .tech-font { font-family: 'JetBrains Mono', monospace; }
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .text-fuchsia { color: var(--accent); }
        .bg-fuchsia { background-color: var(--accent); }
        .border-fuchsia { border-color: var(--accent); }
    </style>
</head>
<body class="p-6 md:p-12 lg:p-20 text-white min-h-screen">

    <div class="max-w-4xl mx-auto">
        <header class="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-6">
            <div>
                <h1 class="text-5xl font-extrabold uppercase tracking-tighter italic">Feedback <span class="text-fuchsia">Radar</span></h1>
                <p class="text-slate-500 text-sm mt-3 font-mono uppercase tracking-[0.2em] flex items-center">
                    <span class="status-dot bg-fuchsia animate-pulse"></span> Terminal v5.0 // Marcq Interaction
                </p>
            </div>
            <div id="stats" class="flex flex-wrap gap-6 justify-end font-mono"></div>
        </header>

        <div class="flex flex-wrap gap-4 mb-12 p-6 bg-white/5 border border-white/10 rounded-3xl items-center">
            <span class="text-[10px] font-mono uppercase text-slate-500 mr-3 tracking-widest font-bold">Responsabilités :</span>
            <div class="flex items-center gap-2 px-4 py-2 bg-blue-500/10 border border-blue-500/30 rounded-full">
                <span class="text-[11px] text-blue-400 font-bold">🔵 Christophe 🙋‍♂️</span>
            </div>
            <div class="flex items-center gap-2 px-4 py-2 bg-pink-500/10 border border-pink-500/30 rounded-full">
                <span class="text-[11px] text-pink-400 font-bold">🌸 Valérie 🙋‍♀️</span>
            </div>
        </div>

        <div id="action-list" class="space-y-6 pb-24"></div>
    </div>

    <button data-tally-open="2Eb629" class="fixed bottom-10 right-10 bg-fuchsia hover:scale-110 active:scale-95 text-white px-8 py-5 rounded-full font-black shadow-2xl shadow-fuchsia/30 flex items-center gap-3 transition-all z-50 uppercase text-xs tracking-widest">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>
        Nouveau retour
    </button>

    <script>
        function openTallyModal(actionId) {
            Tally.openPopup('2Eb629', {
                layout: 'modal',
                width: 500,
                hiddenFields: { action_id: actionId }
            });
        }

        async function loadFeedbacks() {
            try {
                const response = await fetch('feedbacks.json');
                let data = await response.json();
                
                const priorityOrder = { 'question': 1, 'blocked': 2, 'todo': 3, 'done': 4 };
                data.sort((a, b) => (priorityOrder[a.status] || 99) - (priorityOrder[b.status] || 99));

                document.getElementById('stats').innerHTML = `
                    <div class="text-right border-l border-white/10 pl-6"><p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mb-1">Actions</p><p class="text-2xl font-black text-white">${data.length}</p></div>
                    <div class="text-right border-l border-white/10 pl-6"><p class="text-[10px] text-fuchsia uppercase font-bold tracking-widest mb-1">Arbitrages</p><p class="text-2xl font-black text-fuchsia">${data.filter(i=>i.status==='question').length}</p></div>
                `;

                const container = document.getElementById('action-list');
                container.innerHTML = data.map(item => {
                    const config = {
                        'todo': { label: 'À Faire', class: 'border-amber-500/30 text-amber-500 bg-amber-500/5' },
                        'blocked': { label: 'Bloqué', class: 'border-red-500/40 text-red-400 bg-red-500/10' },
                        'question': { label: 'Besoin d\'infos', class: 'border-fuchsia/40 text-fuchsia bg-fuchsia/10' },
                        'done': { label: 'Validé', class: 'border-emerald-500/30 text-emerald-500 bg-emerald-500/5' }
                    }[item.status] || { label: item.status, class: 'border-slate-500 text-slate-500' };

                    const linkedBadge = item.linked_to 
                        ? `<span class="flex items-center gap-1 tech-font text-[9px] bg-white/5 border border-white/20 text-slate-400 px-2 py-0.5 rounded italic">🔗 Lié à #${item.linked_to}</span>`
                        : '';

                    const waitingBadge = item.waiting_for 
                        ? `<span class="ml-auto tech-font text-[10px] px-3 py-1 rounded-full font-bold border ${item.waiting_for === 'Valérie' ? 'bg-pink-500/10 text-pink-400 border-pink-500/30' : 'bg-blue-500/10 text-blue-400 border-blue-500/30'}">
                            ${item.waiting_for === 'Valérie' ? '🌸 ' : '🔵 '}Attente : ${item.waiting_for}
                           </span>` 
                        : '';

                    const isPhoto = item.photo_needed === true;
                    const btnLabel = isPhoto ? "Envoyer la photo" : "Répondre";
                    const btnClass = isPhoto 
                        ? "bg-red-500/10 border-red-500/40 text-red-400 hover:bg-red-500/20" 
                        : "bg-fuchsia/10 border-fuchsia/40 text-fuchsia hover:bg-fuchsia/20";

                    return `
                        <div class="glass p-8 rounded-[2rem] ${item.status === 'done' ? 'opacity-30 grayscale' : ''}">
                            <div class="flex items-center gap-4 mb-6">
                                <span class="tech-font text-[10px] px-3 py-1 rounded border ${config.class} uppercase font-bold tracking-widest">${config.label}</span>
                                ${linkedBadge}
                                <span class="text-slate-600 text-[10px] font-mono uppercase tracking-[0.2em]">// ${item.category}</span>
                                ${item.status !== 'done' ? waitingBadge : ''}
                            </div>
                            <p class="text-white font-semibold text-xl leading-relaxed mb-6">${item.comment}</p>
                            
                            ${item.query ? `
                                <div class="mt-6 p-6 bg-white/5 border border-white/10 rounded-2xl flex flex-col md:flex-row md:items-center justify-between gap-6">
                                    <div class="text-slate-300 text-sm font-medium italic leading-relaxed">
                                        <span class="text-fuchsia font-black not-italic font-mono text-[10px] uppercase mr-2 tracking-tighter">ELISA :</span> "${item.query}"
                                    </div>
                                    <button 
                                        onclick="openTallyModal('#${item.id}')"
                                        class="shrink-0 inline-flex items-center gap-3 px-5 py-2.5 border rounded-xl text-[10px] uppercase font-black tracking-widest transition-all ${btnClass}">
                                        ${btnLabel}
                                    </button>
                                </div>
                            ` : ''}

                            <div class="flex justify-between items-center mt-8 pt-6 border-t border-white/5 uppercase font-mono text-[10px] text-slate-600 tracking-widest">
                                <p>${item.client} <span class="ml-3 text-white/20 font-black">#${item.id}</span></p>
                                <p>${item.date}</p>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) { console.error(e); }
        }
        loadFeedbacks();
    </script>
</body>
</html>
