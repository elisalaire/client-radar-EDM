<script>
    // Fonction pour ouvrir Tally avec l'ID forcé
    function openTally(actionId) {
        if (typeof Tally !== 'undefined') {
            Tally.openPopup('2Eb629', {
                hiddenFields: {
                    action_id: actionId
                }
            });
        } else {
            // Si le script Tally n'est pas encore chargé, on utilise le lien direct
            window.open(`https://tally.so/r/2Eb629?action_id=${actionId}`, '_blank');
        }
    }

    async function loadFeedbacks() {
        try {
            const response = await fetch('feedbacks.json');
            let data = await response.json();
            
            const priorityOrder = { 'question': 1, 'blocked': 2, 'todo': 3, 'done': 4 };
            data.sort((a, b) => (priorityOrder[a.status] || 99) - (priorityOrder[b.status] || 99));

            // Stats
            document.getElementById('stats').innerHTML = `
                <div class="text-right border-l border-white/10 pl-4"><p class="text-[10px] text-slate-500 font-mono uppercase font-bold tracking-widest">Total</p><p class="text-xl font-bold">${data.length}</p></div>
                <div class="text-right border-l border-white/10 pl-4"><p class="text-[10px] text-indigo-400 font-mono uppercase font-bold tracking-widest">Questions</p><p class="text-xl font-bold text-indigo-500">${data.filter(i=>i.status==='question').length}</p></div>
                <div class="text-right border-l border-white/10 pl-4"><p class="text-[10px] text-red-400 font-mono uppercase font-bold tracking-widest">Bloqués</p><p class="text-xl font-bold text-red-500">${data.filter(i=>i.status==='blocked').length}</p></div>
                <div class="text-right border-l border-white/10 pl-4"><p class="text-[10px] text-emerald-400 font-mono uppercase font-bold tracking-widest">Validés</p><p class="text-xl font-bold text-emerald-500">${data.filter(i=>i.status==='done').length}</p></div>
            `;

            const container = document.getElementById('action-list');
            container.innerHTML = data.map(item => {
                const config = {
                    'todo': { label: 'À Faire', class: 'border-amber-500/30 text-amber-500 bg-amber-500/5' },
                    'blocked': { label: 'Bloqué', class: 'border-red-500/40 text-red-400 bg-red-500/10' },
                    'question': { label: 'Besoin d\'infos', class: 'border-indigo-500/40 text-indigo-400 bg-indigo-500/10' },
                    'done': { label: 'Validé', class: 'border-emerald-500/30 text-emerald-500 bg-emerald-500/5' }
                }[item.status] || { label: item.status, class: 'border-slate-500 text-slate-500' };

                return `
                    <div class="glass p-6 rounded-2xl ${item.status === 'done' ? 'opacity-30 grayscale' : ''}">
                        <div class="flex items-center gap-3 mb-4">
                            <span class="tech-font text-[10px] px-2 py-0.5 rounded border ${config.class} uppercase font-bold tracking-wider">${config.label}</span>
                            <span class="text-slate-600 text-[10px] font-mono uppercase tracking-widest">// ${item.category}</span>
                        </div>
                        <p class="text-white font-medium text-lg leading-relaxed">${item.comment}</p>
                        
                        ${item.query ? `
                            <div class="mt-4 p-4 bg-indigo-500/5 border border-indigo-500/20 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div class="text-indigo-300 text-sm font-medium italic">Elisa : "${item.query}"</div>
                                <button 
                                    onclick="openTally('${item.id}')"
                                    class="shrink-0 inline-flex items-center gap-2 px-3 py-1.5 bg-indigo-500/20 border border-indigo-500/40 rounded-lg text-indigo-300 text-[10px] uppercase font-bold tracking-wider hover:bg-indigo-500/40 transition-all">
                                    Répondre
                                </button>
                            </div>
                        ` : ''}

                        <div class="flex justify-between items-center mt-6 pt-4 border-t border-white/5 uppercase font-mono text-[10px] text-slate-600">
                            <p>${item.client} <span class="ml-2 text-slate-400">#${item.id}</span></p>
                            <p>${item.date}</p>
                        </div>
                    </div>
                `;
            }).join('');
        } catch (e) { console.error(e); }
    }
    loadFeedbacks();
</script>
